[package]
name = "bridge-viewer"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
bridge-core = { path = "../bridge-core" }
anyhow.workspace = true
tokio.workspace = true
gpui.workspace = true
quinn.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "x11"] }
bytemuck = { version = "1", features = ["derive"] }
bytes = "1"
hang = "0.21.8"
moq-net = "0.3.7"
moq-video = { version = "0.1.7", default-features = false, features = ["nvidia", "openh264", "render", "vaapi", "v4l2"] }
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "x11"] }
